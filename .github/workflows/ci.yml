name: CI/CD Pipeline for FarmerHub

on:
  push:
    branches:
      - main

jobs:
  backend-test:
    name: Backend Tests (Matrix)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - name:  Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'
          
      - name:  Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

  frontend-build:
    name: Frontend Build & Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name:  Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
          
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci
        
      - name:  Build Frontend
        working-directory: ./frontend
        run: npm run build
        
      - name:  Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-dist
          path: ./frontend/dist/

  docker-publish:
    name: Publish to Docker Hub
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name:  Checkout Code
        uses: actions/checkout@v4

      - name:  Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/sai-backend:latest

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/sai-frontend:latest

  aws-deploy:
    name: Deploy to AWS EC2
    needs: docker-publish
    runs-on: ubuntu-latest
    steps:
      - name: Connect and Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Connected to AWS EC2 Server!"
            
            # 1. Pull the latest code we just built
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/sai-backend:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/sai-frontend:latest
            
            # 2. Stop and remove the old containers (don't fail if they don't exist yet)
            sudo docker stop sai-backend sai-frontend || true
            sudo docker rm sai-backend sai-frontend || true
            
            # 3. Start the Backend Container (Runs on port 5001)
            # Note: Assuming you have a .env file on the server at /home/ubuntu/.env
            sudo docker run -d --name sai-backend -p 5001:5001 --env-file ~/.env --restart unless-stopped ${{ secrets.DOCKER_USERNAME }}/sai-backend:latest
            
            # 4. Start the Frontend Container (Runs on port 80)
            sudo docker run -d --name sai-frontend -p 80:80 --restart unless-stopped ${{ secrets.DOCKER_USERNAME }}/sai-frontend:latest
            
            echo "Successfully deployed new version to Production!"
