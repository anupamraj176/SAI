name: CI/CD Pipeline for FarmerHub

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-test:
    name: Backend Syntax & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Syntax & Dependency Check
        working-directory: ./backend
        run: npm run check

      - name: Run Backend Unit Tests
        working-directory: ./backend
        run: npm test

  frontend-build:
    name: Frontend Build & Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-dist
          path: ./frontend/dist/
          retention-days: 7

  infra-validate:
    name: Validate Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Example Env for Validation
        run: cp backend/.env.example backend/.env

      - name: Validate Docker Compose Syntax
        run: docker compose config -q

  docker-publish:
    name: Scan & Publish Docker Images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-test, frontend-build, infra-validate]
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image (Local)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/sai-backend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/sai-backend:latest

      - name: Trivy Gate - CRITICAL CVEs (Backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/sai-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Trivy Advisory - HIGH CVEs (Backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/sai-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH'

      - name: Push Backend Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/sai-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/sai-backend:latest

      - name: Build Frontend Image (Local)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          load: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/sai-frontend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/sai-frontend:latest

      - name: Trivy Gate - CRITICAL CVEs (Frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/sai-frontend:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Trivy Advisory - HIGH CVEs (Frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/sai-frontend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH'

      - name: Push Frontend Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/sai-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/sai-frontend:latest

  aws-deploy:
    name: Deploy to AWS EC2
    # Set repository variable ENABLE_EC2_DEPLOY=true once the new AWS EC2 secrets are configured
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_EC2_DEPLOY == 'true'
    needs: docker-publish
    runs-on: ubuntu-latest
    steps:
      - name: Connect and Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            IMAGE_TAG="${{ needs.docker-publish.outputs.image_tag }}"
            BACKEND_IMAGE="${{ secrets.DOCKER_USERNAME }}/sai-backend:${IMAGE_TAG}"
            FRONTEND_IMAGE="${{ secrets.DOCKER_USERNAME }}/sai-frontend:${IMAGE_TAG}"

            echo "Deploying release ${IMAGE_TAG} to AWS EC2..."

            sudo docker network inspect sai_network >/dev/null 2>&1 || sudo docker network create sai_network

            if ! sudo docker ps -a --format '{{.Names}}' | grep -qx 'sai-redis'; then
              sudo docker run -d \
                --name sai-redis \
                --network sai_network \
                --network-alias redis \
                --restart unless-stopped \
                redis:7-alpine
            else
              sudo docker network connect --alias redis sai_network sai-redis 2>/dev/null || true
              sudo docker start sai-redis >/dev/null 2>&1 || true
            fi

            sudo docker pull "${BACKEND_IMAGE}"
            sudo docker pull "${FRONTEND_IMAGE}"

            sudo docker stop sai-backend || true
            sudo docker rm sai-backend || true
            sudo docker run -d \
              --name sai-backend \
              --network sai_network \
              --network-alias backend \
              -p 5001:5001 \
              --env-file ~/.env \
              -e REDIS_URL=redis://redis:6379 \
              --restart unless-stopped \
              "${BACKEND_IMAGE}"

            echo "Waiting for backend /health endpoint..."
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:5001/health >/dev/null 2>&1; then
                echo "Backend is healthy!"
                break
              fi
              if [ "$i" -eq 15 ]; then
                echo "Backend failed health check! Recent logs:"
                sudo docker logs --tail 50 sai-backend || true
                exit 1
              fi
              sleep 2
            done

            sudo docker stop sai-frontend || true
            sudo docker rm sai-frontend || true
            sudo docker run -d \
              --name sai-frontend \
              --network sai_network \
              -p 80:80 \
              --restart unless-stopped \
              "${FRONTEND_IMAGE}"

            curl -fsS http://127.0.0.1/ >/dev/null || {
              echo "Frontend health check failed!"
              sudo docker logs --tail 30 sai-frontend || true
              exit 1
            }

            sudo docker image prune -f >/dev/null 2>&1 || true
            echo "Successfully deployed ${IMAGE_TAG} to Production!"
