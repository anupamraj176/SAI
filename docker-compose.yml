version: '3.8'

services:
  redis:
    image: redis:latest
    container_name: sai_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - sai_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sai_backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - sai_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass build-time variables if needed, Vite needs VITE_ variables at build time
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    container_name: sai_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sai_network

networks:
  sai_network:
    driver: bridge
