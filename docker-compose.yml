services:
  redis:
    image: redis:7-alpine
    container_name: sai_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - sai_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sai_backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sai_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass build-time variables if needed, Vite needs VITE_ variables at build time
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    container_name: sai_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sai_network

networks:
  sai_network:
    driver: bridge
