apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: sai-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend-container
          image: anupamraj176/sai-backend:latest
          ports:
            - containerPort: 5001
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: PORT
              value: "5001"
            - name: CLIENT_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: CLIENT_URL
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: CORS_ORIGINS
            - name: CLOUD_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: CLOUD_NAME
            - name: EMAIL_USER
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: EMAIL_USER
            - name: SUPPORT_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: SUPPORT_EMAIL
            - name: PAYMENT_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: PAYMENT_PROVIDER
            - name: RAZORPAY_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: RAZORPAY_KEY_ID
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: NODE_ENV
            - name: MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: sai-secret
                  key: MONGODB_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sai-secret
                  key: JWT_SECRET
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: sai-secret
                  key: API_KEY
            - name: API_SECRET
              valueFrom:
                secretKeyRef:
                  name: sai-secret
                  key: API_SECRET
            - name: EMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sai-secret
                  key: EMAIL_APP_PASSWORD
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sai-secret
                  key: GEMINI_API_KEY
            - name: RAZORPAY_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: sai-secret
                  key: RAZORPAY_KEY_SECRET
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sai-secret
                  key: REDIS_URL
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: sai-secret
                  key: AWS_REGION
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: sai-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: sai-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: sai-secret
                  key: AWS_S3_BUCKET_NAME
