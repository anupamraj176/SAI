apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: sai-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend-container
          image: anupamraj176/sai-frontend:latest
          ports:
            - containerPort: 80